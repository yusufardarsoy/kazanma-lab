name: R checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R dependencies
        run: Rscript -e "install.packages(c('bslib','DBI','dplyr','ggplot2','glue','httr2','jsonlite','purrr','RSQLite','scales','shiny','shinyjs','sodium','tidyr','testthat'), repos='https://cloud.r-project.org')"
      - name: Run tests
        run: Rscript tests/testthat.R

